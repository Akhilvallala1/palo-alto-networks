# Conduit CI — adapted from the workflow running in Akhilvallala1/rival-radar.
#
# Three things changed against that original, all of them required by this
# epic's acceptance criteria:
#
#   * rival-radar's CI sets `ANTHROPIC_API_KEY: test-key` to get past import
#     time. Conduit sets no key anywhere in this file. That is not tidiness —
#     the registry only instantiates an adapter whose key env var is present, so
#     an unset key is what makes CI exercise the same mock + Ollama path AC-17
#     claims for a clean machine. A key here would quietly test a config nobody
#     ships.
#   * unit and integration are separate stages (AC-18), split by the filename
#     convention in `tests/conftest.py`.
#   * coverage is a gate, not a report (AC-19), and the eval plane runs its own
#     regression gate against `mock:echo` (AC-13).
#
# No step in this workflow reads a secret, so there is nothing here to leak.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only. CI builds nothing that needs to be published and touches no
# credential; the deploy workflow is the only place that authenticates anywhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Lint · Types · Tests · Eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor in `requires-python`. Testing on the floor is the only way
          # the floor means anything.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check src tests apps evals scripts

      - name: Format (ruff format --check)
        # Scoped to code. `ruff format .` reformats the frozen contract block in
        # docs/SPEC.md, which is the epic's source of truth for every child
        # issue — a formatter is not allowed to edit it.
        run: ruff format --check src tests apps

      - name: Type check (mypy --strict)
        run: mypy --strict src/conduit apps

      - name: Vendor SDK guard (AC-16)
        # Runs inside the unit stage too. It gets its own step so that when the
        # constraint breaks, the failing check is named after the rule it
        # enforces rather than buried in an 800-test summary.
        run: pytest tests/test_no_vendor_imports.py -q

      - name: Unit tests
        run: coverage run -p -m pytest -m "not integration" -q

      - name: Integration tests
        run: coverage run -p -m pytest -m integration -q

      - name: Coverage ≥80% on src/conduit (AC-19)
        run: |
          coverage combine
          coverage report
          coverage xml

      - name: Eval regression gate (AC-13)
        # `config/eval.yaml` pins `model_under_test: mock:echo` and an offline
        # judge, so this suite costs nothing and needs no network. A >5%
        # regression against `evals/baselines/` exits non-zero here.
        run: conduit-eval run --gate --report-dir eval-report

      - name: Publish eval report to the job summary
        if: always()
        run: |
          if [ -f eval-report/report.md ]; then
            cat eval-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage and eval artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage.xml
            eval-report/
          retention-days: 14
          if-no-files-found: warn

  container:
    name: Container · zero-key compose smoke test (AC-17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test client
        run: pip install -e ".[dev]"

      - name: Build the gateway image
        run: docker compose build gateway

      - name: Start the stack with zero API keys
        # `--no-deps` skips Ollama: this job is asserting that the gateway is
        # useful on its own, which is the weaker and therefore more interesting
        # half of AC-17. The Ollama path is exercised locally and documented in
        # docs/ARCHITECTURE.md.
        run: docker compose up -d --no-deps --wait gateway

      - name: Assert the container is non-root and keyless
        run: |
          uid="$(docker compose exec -T gateway id -u)"
          test "$uid" = "10001" || { echo "gateway runs as uid $uid, expected 10001"; exit 1; }
          if docker compose exec -T gateway env | grep -qE '(API_KEY|CREDENTIALS)='; then
            echo "a credential reached the container; AC-17 requires none"
            exit 1
          fi

      - name: End-to-end — healthz, then a completion through mock
        env:
          CONDUIT_E2E_BASE_URL: http://localhost:8000
        run: pytest tests/test_compose_e2e.py -q

      - name: Gateway logs
        if: always()
        run: docker compose logs --no-color gateway

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
