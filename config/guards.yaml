# Guard settings. A verdict at or above a threshold blocks the request when
# fail_closed is true; every verdict is logged with its category and score.
fail_closed: true

pii:
  enabled: true
  # Presidio entity names plus GTM-specific identifiers.
  entities:
    - PERSON
    - EMAIL_ADDRESS
    - PHONE_NUMBER
    - US_SSN
    - CREDIT_CARD
    - IBAN_CODE
    - GTM_OPPORTUNITY_ID
    - GTM_QUOTE_NUMBER
  score_threshold: 0.5
  # Redaction is reversible: the egress guard rehydrates from entity_map.
  redact: true

injection:
  enabled: true
  risk_threshold: 0.7
  # Optional LLM classifier, high-risk traffic only.
  llm_classifier: false
  llm_classifier_above: 0.5
