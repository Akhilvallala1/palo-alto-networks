[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conduit"
version = "0.1.0"
description = "A proxy-first AI gateway for lead-to-cash workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akhil Vallala" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7,<3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

# Vendor SDKs are optional extras, never core deps. Only code under
# src/conduit/providers/ may import them (epic AC-16).
[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
gemini = ["google-generativeai>=0.8"]

# The L2C demo app (#9). Not core: the gateway must install and run without a
# graph framework or a vector extension. LangGraph pulls langchain-core, which
# is not a vendor SDK — it never talks to a model here, because every model call
# in apps/ goes through Conduit's HTTP API.
l2c = [
    "langgraph>=1.0",
    "sqlite-vec>=0.1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.6",
    "types-PyYAML>=6.0",
    # AC-1 is "an unmodified OpenAI SDK client gets a valid completion", so the
    # gateway's integration suite drives the real SDK over an ASGI transport
    # (offline). Without this the test skips and the claim goes unverified.
    "openai>=1.40",
    # The L2C suite is part of the full run, so its deps are dev deps too.
    "langgraph>=1.0",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
conduit-eval = "conduit.eval.cli:main"
l2c = "apps.l2c.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conduit", "apps"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The one-shot dataset authoring scripts are kept as provenance records: one
# labelled case per line, so a reviewer can audit a label against the SPEC
# category beside it. Reflowing those tables would destroy exactly what makes
# them auditable.
extend-exclude = ["evals/authoring"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# UP042 wants StrEnum for `class Complexity(str, Enum)`. The epic's frozen
# interface contract specifies that exact base list, and StrEnum changes
# `str(Complexity.TRIVIAL)`, so it is an API break rather than a modernization.
ignore = ["UP042"]

[tool.ruff.lint.isort]
# `apps` is a top-level package at the repo root rather than under src/, so
# isort would otherwise sort the L2C app in with third-party libraries.
known-first-party = ["conduit", "apps", "tests"]

[tool.ruff.lint.per-file-ignores]
# Protocol stubs and fixtures legitimately shadow builtins / go unused.
"tests/*" = ["A002"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/conduit", "apps"]
plugins = ["pydantic.mypy"]

# LangGraph ships partial annotations; `StateGraph.compile()` in particular is
# loose enough that strict mode cannot follow it. The app's own code is still
# checked strictly — this only stops the graph framework's gaps from being
# reported as errors in our files.
[[tool.mypy.overrides]]
module = ["langgraph.*", "sqlite_vec.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `apps` is a top-level package in the repo root rather than under `src/`, so
# the root has to be importable for the L2C suite to find it.
pythonpath = ["."]
# Applied by `tests/conftest.py` from the module's filename, so CI can report
# unit and integration as separate stages (AC-18) without a marker decorator on
# every one of 800 tests.
markers = [
    "integration: wires several packages together, or talks outside the process",
]

[tool.coverage.run]
source = ["src/conduit"]
branch = true

[tool.coverage.report]
# AC-19, committed rather than passed as a CI flag: the threshold is a property
# of the project, so `coverage report` fails the same way on a laptop as it does
# in the workflow.
fail_under = 80
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol bodies are `...` by definition and can never be executed.
    "^\\s*\\.\\.\\.$",
]
